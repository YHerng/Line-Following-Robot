; PlatformIO project configuration
; https://docs.platformio.org/page/projectconf.html
;
; The primary target is the Arduino UNO Q. Because the Q series has no
; official PlatformIO support, this project uses the community platform
; "lee-lab-skku/arduinoq". IMPORTANT: that platform only builds on Linux;
; see the README for how to build from Windows/macOS using remote builds.

[platformio]
; `pio run` with no -e flag builds this environment.
; Use `pio run -e uno` for the classic AVR fallback.
default_envs = uno_q

; ---------------------------------------------------------------------------
; Arduino UNO Q  (target board)
; ---------------------------------------------------------------------------
[env:uno_q]
platform = https://github.com/lee-lab-skku/platform-arduinoq.git
; Alternative, pinned registry release (if you prefer a fixed version):
; platform = lee-lab-skku/arduinoq@1.0.0-rc.3
board = uno_q
framework = arduino

; Serial on the UNO Q is a logical channel carried over the MCU<->MPU link,
; so it needs the RouterBridge library. It also exposes a TCP socket rather
; than a USB serial port.
monitor_speed = 115200
monitor_port = socket://localhost:7500

; Servo 1.3.0 is the first release with Zephyr / UNO Q support.
lib_deps =
    arduino-libraries/Servo@^1.3.0
    https://github.com/lee-lab-skku/arduino-router-bridge.git

; ---------------------------------------------------------------------------
; Classic AVR fallback  (Arduino Uno / Nano, 5 V logic)
; ---------------------------------------------------------------------------
; Handy for bench testing and for verifying the code on a normal Uno.
; Build it locally with:  pio run -e uno
[env:uno]
platform = atmelavr
board = uno
framework = arduino
monitor_speed = 115200
lib_deps =
    arduino-libraries/Servo@^1.3.0
