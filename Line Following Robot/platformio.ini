; PlatformIO project configuration
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = uno

[env:uno]
platform = atmelavr
board = uno
framework = arduino

; Serial monitor and upload speed
monitor_speed = 115200
upload_speed = 115200

; The AVR Arduino framework does not bundle the Servo library,
; so pull it in from the registry.
lib_deps =
    arduino-libraries/Servo
